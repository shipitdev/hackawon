name: Collect winners

# The winners corpus grows slowly and old entries never expire, so weekly is plenty. It is the
# evidence base behind every generated idea, which is why it runs on its own schedule rather than
# being bolted onto the 6-hourly ingest.
on:
  schedule:
    - cron: "50 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the deploy

env:
  # GitHub's own Actions identity: commits show the Actions avatar and link to it, instead of an
  # unlinked name with a made-up address.
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

# One group for every job that writes the data branch, so they run one at a time and never push
# over each other.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  winners:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get the current data
        run: scripts/data-branch.sh pull

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: backend
        run: |
          uv venv
          uv pip install -e .

      - name: Search GitHub for hackathon winners
        working-directory: backend
        env:
          # The default token is enough for search, and raises the rate limit from 10 to 30
          # requests per minute.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m app.jobs.ingest_winners

      - name: Label the new ones
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Cached by content hash, so only genuinely new winners cost anything.
        run: uv run python -m app.jobs.classify --kind winners --provider gemini || true

      - name: Push to the data branch
        id: push
        run: scripts/data-branch.sh push "Update winners corpus"

      - name: Deploy the site with the new data
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A push made with the workflow token never triggers other workflows, so the deploy has to
        # be started explicitly. Starting a workflow by dispatch is the one exception allowed.
        run: gh workflow run pages.yml --ref main
