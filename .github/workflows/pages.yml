name: Deploy site

# Publishes the static site: code from main, generated data from the `data` branch. Runs when the
# site's code or hand-edited data changes on main, and is started by the data jobs after they push.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/app/**"
      - "data/*.yml"
      - "scripts/data-branch.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the current data
        run: scripts/data-branch.sh pull
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the site bundle
        working-directory: backend
        run: |
          uv venv
          uv pip install -e .
          uv run python -m app.jobs.export_site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        # A GitHub Pages *project* site is served from /<repo>/, so assets need that prefix.
        # For a user site (<user>.github.io) or a custom domain, set VITE_BASE to "/".
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # The prerenderer writes absolute URLs into canonical tags, OG tags and the sitemap,
          # so it needs the real origin — relative URLs are not valid in any of those.
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          # Read from secrets rather than variables only because that is where they were set.
          # Both values are public by design: the anon key ships in the browser bundle and row
          # level security is what protects user data. Storing them as secrets costs nothing but
          # log masking. Absent, the site builds with sign-in hidden.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
