name: Deploy site

# Publishes the static site. Runs after data changes land, so the published listings track the
# scraper without a second manual step.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        # A GitHub Pages *project* site is served from /<repo>/, so assets need that prefix.
        # For a user site (<user>.github.io) or a custom domain, set VITE_BASE to "/".
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # The prerenderer writes absolute URLs into canonical tags, OG tags and the sitemap,
          # so it needs the real origin — relative URLs are not valid in any of those.
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          # Public by design — the anon key is meant to ship in a browser bundle, and row level
          # security is what protects user data. Absent, the site builds with sign-in hidden.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
