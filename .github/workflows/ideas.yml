name: Generate ideas

# Ideas are written once per hackathon and then served to every visitor from a file, so cost
# scales with the number of hackathons rather than with traffic. After the first full run this
# only covers newly-ingested hackathons — usually a handful a night.
on:
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate ideas that already exist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ideas
  cancel-in-progress: false

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: backend
        run: |
          uv venv
          uv pip install -e .

      - name: Generate
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Each hackathon takes ~30s (large prompt in, ~1.2k tokens out), so a full backfill of
          # 262 runs for hours. The budget stops it cleanly with time to spare before the job
          # timeout — otherwise CI would kill the job before the commit step and bin the work.
          # Whatever is left simply resumes tomorrow night.
          uv run python -m app.jobs.generate_ideas --provider gemini --max-minutes 50 \
            ${{ inputs.force && '--force' || '' }}

      - name: Rebuild the site bundle
        working-directory: backend
        run: uv run python -m app.jobs.export_site

      - name: Commit any changes
        run: |
          git config user.name "hackradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data frontend/public/data
          if git diff --cached --quiet; then
            echo "No new ideas."
            exit 0
          fi
          git commit -m "Update generated ideas"
          git push
