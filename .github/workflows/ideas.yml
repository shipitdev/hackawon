name: Generate ideas

# Ideas are written once per hackathon and then served to every visitor from a file, so cost
# scales with the number of hackathons rather than with traffic. After the first full run this
# only covers newly-ingested hackathons — usually a handful a night.
on:
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate ideas that already exist"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # to start the deploy

env:
  # GitHub's own Actions identity: commits show the Actions avatar and link to it, instead of an
  # unlinked name with a made-up address.
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

# One group for every job that writes the data branch, so they run one at a time and never push
# over each other.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Get the current data
        run: scripts/data-branch.sh pull

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: backend
        run: |
          uv venv
          uv pip install -e .

      - name: Generate
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Each hackathon takes ~30s (large prompt in, ~1.2k tokens out), so a full backfill of
          # 262 runs for hours. The budget stops it cleanly with time to spare before the job
          # timeout — otherwise CI would kill the job before the commit step and bin the work.
          # Whatever is left simply resumes tomorrow night.
          uv run python -m app.jobs.generate_ideas --provider gemini --max-minutes 50 \
            ${{ inputs.force && '--force' || '' }}

      - name: Push to the data branch
        id: push
        run: scripts/data-branch.sh push "Update generated ideas"

      - name: Deploy the site with the new data
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A push made with the workflow token never triggers other workflows, so the deploy has to
        # be started explicitly. Starting a workflow by dispatch is the one exception allowed.
        run: gh workflow run pages.yml --ref main
