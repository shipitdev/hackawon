name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      # Tests run entirely against saved fixtures, so CI never touches the live sites.
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # The build prerenders a page per hackathon, so it needs real data from the data branch.
      - name: Get the current data
        working-directory: .
        run: scripts/data-branch.sh pull
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the site bundle
        working-directory: backend
        run: |
          uv venv
          uv pip install -e .
          uv run python -m app.jobs.export_site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
