name: Ingest hackathons

# The scraper is the whole backend: it runs here, pushes the results to the `data` branch, and
# starts the Pages deploy. Nothing else runs between visits.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the hour to avoid the stampede
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the deploy

env:
  # GitHub's own Actions identity: commits show the Actions avatar and link to it, instead of an
  # unlinked name with a made-up address.
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

# One group for every job that writes the data branch, so they run one at a time and never push
# over each other.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the current data
        run: scripts/data-branch.sh pull

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: backend
        run: |
          uv venv
          uv pip install -e .

      - name: Fetch sources
        working-directory: backend
        run: uv run python -m app.jobs.ingest

      - name: Label new hackathons by topic
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Labels are cached by content hash, so this only calls the API for genuinely new or
        # changed hackathons — usually a handful per run. Never fail the job over it: stale
        # labels are much better than losing a whole ingest.
        run: uv run python -m app.jobs.classify --kind hackathons --provider gemini || true

      - name: Push to the data branch
        id: push
        run: scripts/data-branch.sh push "Update hackathon data"

      - name: Deploy the site with the new data
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A push made with the workflow token never triggers other workflows, so the deploy has to
        # be started explicitly. Starting a workflow by dispatch is the one exception allowed.
        run: gh workflow run pages.yml --ref main
